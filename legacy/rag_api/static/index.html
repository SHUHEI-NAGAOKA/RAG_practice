<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 質問応答</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #dddddd;
    --soft: #f6f6f6;
    --accent: #2b6cb0;
    --error: #c53030;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  header .inner, #log, footer .inner { max-width: 820px; margin: 0 auto; }
  header .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  header h1 { font-size: 1.05rem; margin: 0; margin-right: auto; }
  header label { font-size: 0.88rem; color: var(--muted); }
  select, input[type=number] {
    font: inherit; font-size: 0.88rem;
    padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: #fff;
  }
  input[type=number] { width: 4em; }

  main { flex: 1; overflow-y: auto; padding: 16px; }
  #log { display: flex; flex-direction: column; gap: 18px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 0.92rem; }

  .msg { max-width: 100%; }
  .msg.user { align-self: flex-end; background: var(--soft); border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; }
  .msg.bot .role { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
  .msg.bot .answer { white-space: pre-wrap; }
  .msg.bot .loading { color: var(--muted); }
  .msg.bot .error { color: var(--error); }

  .sources { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; }
  .sources-title { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  details { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; }
  summary { cursor: pointer; padding: 4px 10px; font-size: 0.86rem; }
  summary .meta { color: var(--muted); }
  details .body { padding: 6px 10px 10px; font-size: 0.86rem; white-space: pre-wrap; border-top: 1px solid var(--border); }

  footer { border-top: 1px solid var(--border); padding: 10px 16px; }
  footer form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    min-height: 44px; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; padding: 8px 18px; border: none; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* 話題の候補 */
  .topics-title { font-size: 0.86rem; color: var(--muted); margin: 4px 0 6px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic {
    background: #fff; color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; text-align: left; max-width: 100%;
  }
  .topic .desc { display: block; font-size: 0.76rem; color: var(--muted); }
  .topic.on { border-color: var(--accent); background: #ebf4ff; }
  .topic.on .desc { color: #2c5282; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .actions .count { font-size: 0.82rem; color: var(--muted); }
  .research { display: flex; gap: 8px; margin-top: 10px; }
  .research input {
    flex: 1; min-width: 0; font: inherit; font-size: 0.9rem;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  }
  .research input:focus { outline: none; border-color: var(--accent); }
  button.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .levels { display: flex; flex-direction: column; gap: 6px; }
  .level-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .level-row .rank { font-size: 0.75rem; color: var(--muted); min-width: 1.6em; }
  .level-row .sep { color: var(--muted); }
  .topic.node { padding: 3px 10px; font-size: 0.86rem; }
  .warn { font-size: 0.82rem; color: #b7791f; }
  button.back { margin-top: 10px; padding: 4px 12px; font-size: 0.85rem; }
  details.direct { margin-top: 10px; }
  .group-title { font-size: 0.84rem; font-weight: 600; margin: 10px 0 4px; }
  details.direct .levels { padding: 8px 10px; }

  /* 評価モード */
  #evalBar { display: none; border-bottom: 1px solid var(--border); background: #fffbea; padding: 8px 16px; }
  #evalBar.on { display: block; }
  #evalBar .inner { max-width: 820px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.86rem; }
  #evalBar input[type=text] { font: inherit; font-size: 0.86rem; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; width: 15em; }
  #evalBar select { max-width: 100%; }
  #evalBar button { padding: 4px 12px; font-size: 0.85rem; }
  #evalQuestion { flex-basis: 100%; font-weight: 600; }
  .eval-actions { margin-top: 12px; padding: 8px 10px; border: 1px dashed #d69e2e; border-radius: 6px; background: #fffbea; }
  .eval-actions .hint { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>RAG 質問応答</h1>
    <label>モード
      <select id="mode">
        <option value="levels">階層を選んで回答（/levels → /subtopics → /answer）</option>
        <option value="ask">回答生成（/ask）</option>
        <option value="search">検索のみ（/search）</option>
      </select>
    </label>
    <label>top_k <input id="topk" type="number" min="1" max="10" value="3"></label>
    <label><input type="checkbox" id="evalToggle"> 評価モード</label>
  </div>
</header>

<!-- 評価モード: テストの質問を1問ずつ自分で選んで回答し、結果を記録する -->
<div id="evalBar">
  <div class="inner">
    <label>記録名 <input type="text" id="evalRun"></label>
    <button type="button" class="sub" id="evalNewRun">新しい記録を始める</button>
    <span id="evalProgress" class="count"></span>
    <select id="evalSelect"></select>
    <button type="button" id="evalStart">この質問で開始</button>
    <button type="button" class="sub" id="evalSkip">この質問をスキップ</button>
    <div id="evalQuestion"></div>
  </div>
</div>

<main id="scroller">
  <div id="log">
    <p class="empty" id="empty">質問を入力してください。</p>
  </div>
</main>

<footer>
  <div class="inner">
    <form id="form">
      <textarea id="q" rows="1" placeholder="質問を入力"></textarea>
      <button id="send" type="submit">送信</button>
    </form>
    <div class="hint">Enter で送信 / Shift+Enter で改行</div>
  </div>
</footer>

<script>
  const log = document.getElementById("log");
  const scroller = document.getElementById("scroller");
  const form = document.getElementById("form");
  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const modeSel = document.getElementById("mode");
  const topkInput = document.getElementById("topk");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function scrollBottom() { scroller.scrollTop = scroller.scrollHeight; }

  function renderSources(container, sources) {
    if (!sources || sources.length === 0) return;
    const box = el("div", "sources");
    box.appendChild(el("div", "sources-title", "出典"));
    for (const s of sources) {
      const d = el("details");
      const sum = el("summary");
      const heading = s.headings && s.headings.length ? s.headings.join(" > ") : "（見出しなし）";
      sum.appendChild(document.createTextNode(`[${s.source_number}] ${heading} `));
      sum.appendChild(el("span", "meta",
        `p.${(s.page_numbers || []).join(", ")} / score ${s.score.toFixed(4)}`));
      d.appendChild(sum);
      d.appendChild(el("div", "body", s.text));
      box.appendChild(d);
    }
    container.appendChild(box);
  }

  function getTopK() {
    let topK = parseInt(topkInput.value, 10);
    return (topK >= 1 && topK <= 10) ? topK : 3;
  }

  async function postJson(path, payload) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : `HTTP ${res.status}`);
    return data;
  }

  // 待ち時間を表示しながら処理を実行する（LLM が CPU で動くため数十秒〜数分かかる）
  async function withStatus(container, label, fn) {
    const status = el("div", "loading", `${label}… 0秒`);
    container.appendChild(status);
    scrollBottom();
    const started = Date.now();
    const timer = setInterval(() => {
      status.textContent = `${label}… ${Math.floor((Date.now() - started) / 1000)}秒`;
    }, 1000);
    try {
      return await fn((Date.now() - started) / 1000);
    } catch (err) {
      container.appendChild(el("div", "error", `エラー: ${err.message}`));
      return null;
    } finally {
      clearInterval(timer);
      status.remove();
      container.dataset.seconds = ((Date.now() - started) / 1000).toFixed(1);
      scrollBottom();
    }
  }

  function tokenHint(data, seconds) {
    const tok = data.prompt_tokens != null ? ` / LLM入力 ${data.prompt_tokens} トークン（上限 ${data.num_ctx}）` : "";
    return el("div", "hint", `${seconds}秒${tok}`);
  }

  // 再検索の入力欄（元の質問を入れておき、書き換えて①からやり直す）
  function researchBox(question, onBefore) {
    const research = el("div", "research");
    const input = el("input");
    input.value = question;
    input.placeholder = "再検索する質問";
    const again = el("button", "sub", "再検索");
    again.type = "button";
    research.appendChild(input);
    research.appendChild(again);
    const go = () => { const v = input.value.trim(); if (!v) return; onBefore(); askLevels(v); };
    again.addEventListener("click", go);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); go(); } });
    return { research, input, again };
  }

  // 戻る: ある段より後ろのやり取りを消す（前の段のボタンは押せるまま残すので、選び直せる）
  function truncateAfter(node) {
    while (node.nextSibling) node.nextSibling.remove();
  }
  function backButton(label, userMsg, bot) {
    const b = el("button", "sub back", label);
    b.type = "button";
    b.addEventListener("click", () => {
      const prev = userMsg.previousSibling;
      userMsg.remove();
      bot.remove();
      truncateAfter(prev);
      prev.scrollIntoView ? prev.scrollIntoView({ block: "end" }) : scrollBottom();
    });
    return b;
  }

  // ① 質問 → 当たったチャンクの見出しの経路を、段ごとのボタンで表示（知りたい範囲を1つ選ぶ）
  async function askLevels(question) {
    document.getElementById("empty")?.remove();
    log.appendChild(el("div", "msg user", question));
    const bot = el("div", "msg bot");
    bot.appendChild(el("div", "role", "知りたい範囲"));
    bot.appendChild(el("div", "topics-title", "調べたい話題を選んでください（複数可）。（ ）内はその話題の資料（チャンク）の数です。"));
    const topicBox = el("div", "topics");
    bot.appendChild(topicBox);
    // LLM の話題が合わないとき用: 当たった見出しの経路から直接選ぶ（右ほど細かい範囲）
    const direct = el("details", "direct");
    direct.appendChild(el("summary", "", "見出しから直接選ぶ"));
    const list = el("div", "levels");
    direct.appendChild(list);
    bot.appendChild(direct);
    const actions = el("div", "actions");
    const next = el("button", "", "選んだ話題で次へ");
    next.type = "button";
    next.disabled = true;
    const count = el("span", "count", "0 件選択中");
    const more = el("button", "sub", "次の候補を探す");
    more.type = "button";
    actions.appendChild(next);
    actions.appendChild(count);
    actions.appendChild(more);
    bot.appendChild(actions);
    const { research } = researchBox(question, () => truncateAfter(bot));
    bot.appendChild(research);
    log.appendChild(bot);

    let offset = 0;
    const shown = new Set();
    const shownTopics = new Set();
    // 話題・見出しのどちらのボタンでも、押すたびに選択と解除を切り替える（同じ範囲のボタンは連動）
    const selected = new Map();  // 経路 → { node, label }
    const choose = (b, node, label) => {
      const k = node.path.join(" > ");
      if (selected.has(k)) selected.delete(k); else selected.set(k, { node, label });
      bot.querySelectorAll(".topic").forEach((x) => x.classList.toggle("on", selected.has(x.dataset.key)));
      count.textContent = `${selected.size} 件選択中`;
      next.disabled = selected.size === 0;
    };
    next.addEventListener("click", () => {
      truncateAfter(bot);
      const picks = [...selected.values()];
      evalState.levelPicks = picks.map((x) => ({ label: x.label, path: x.node.path }));
      askSubtopics(question, picks);
    });
    async function load() {
      more.disabled = true;
      const data = await withStatus(topicBox, "見出しを検索して話題を作成中", () =>
        postJson("/levels", { question, offset }));
      if (!data) { more.disabled = false; return; }
      let addedTopics = 0;
      for (const t of data.topics) {
        const k = t.node.path.join(" > ");
        if (shownTopics.has(k)) continue;
        shownTopics.add(k);
        addedTopics++;
        const b = el("button", "topic", `${t.title}（${t.node.chunk_count}）`);
        b.type = "button";
        b.title = t.node.path.slice(1).join(" > ");
        b.dataset.key = k;
        if (selected.has(k)) b.classList.add("on");
        if (t.description) b.appendChild(el("span", "desc", t.description));
        b.addEventListener("click", () => choose(b, t.node, t.title));
        topicBox.appendChild(b);
      }
      if (!addedTopics) topicBox.appendChild(el("div", "hint", `${offset + 1}〜${offset + 10}件目からは新しい話題を作れませんでした。「見出しから直接選ぶ」も使えます。`));
      let added = 0;
      for (const h of data.hits) {
        const key = h.nodes[h.nodes.length - 1].path.join(" > ");
        if (shown.has(key)) continue;
        shown.add(key);
        added++;
        const row = el("div", "level-row");
        row.appendChild(el("span", "rank", `${h.rank}`));
        h.nodes.forEach((n, i) => {
          if (i) row.appendChild(el("span", "sep", "›"));
          const b = el("button", "topic node", `${n.title}（${n.chunk_count}）`);
          b.type = "button";
          b.title = n.path.join(" > ");
          b.dataset.key = n.path.join(" > ");
          if (selected.has(b.dataset.key)) b.classList.add("on");
          b.addEventListener("click", () => choose(b, n, n.title));
          row.appendChild(b);
        });
        list.appendChild(row);
      }
      if (!added) list.appendChild(el("div", "hint", `${offset + 1}〜${offset + 10}件目に新しい見出しはありませんでした。`));
      offset = data.next_offset;
      more.disabled = !data.has_more;
      if (!data.has_more) more.textContent = "これ以上の候補はありません";
      scrollBottom();
    }
    more.addEventListener("click", load);
    await load();
  }

  // ② 選んだ範囲 → 配下のチャンクをすべて数え、1段下の見出しを話題のボタンで表示（複数選択）
  async function askSubtopics(question, picks) {
    const userMsg = el("div", "msg user", `選んだ話題: ${picks.map((x) => x.label).join("、")}`);
    log.appendChild(userMsg);
    const bot = el("div", "msg bot");
    bot.appendChild(el("div", "role", "話題"));
    log.appendChild(bot);
    const back = backButton("← 最初の話題を選び直す", userMsg, bot);
    const data = await withStatus(bot, "配下のチャンクを取得中", () =>
      postJson("/subtopics", { paths: picks.map((x) => x.node.path) }));
    if (!data) { bot.appendChild(back); return; }

    bot.appendChild(el("div", "topics-title", `選んだ範囲の配下にチャンクが ${data.total} 個あります。知りたい話題を選んでください（複数可）。`));
    const selected = new Map();
    // ①で選んだ範囲ごとに、1段下の見出しを並べる
    for (const g of data.groups) {
      if (data.groups.length > 1) bot.appendChild(el("div", "group-title", `${g.title}（${g.total}）`));
      const box = el("div", "topics");
      for (const t of g.topics) {
        const b = el("button", "topic", `${t.title}（${t.chunk_count}）`);
        b.type = "button";
        b.addEventListener("click", () => {
          const k = t.path.join(" > ");
          if (selected.has(k)) selected.delete(k); else selected.set(k, t);
          b.classList.toggle("on", selected.has(k));
          update();
        });
        box.appendChild(b);
      }
      bot.appendChild(box);
    }

    const actions = el("div", "actions");
    const go = el("button", "", "選んだ話題で回答");
    go.type = "button";
    go.disabled = true;
    const count = el("span", "count", "0 件選択中");
    const warn = el("span", "warn", "");
    actions.appendChild(go);
    actions.appendChild(count);
    actions.appendChild(warn);
    bot.appendChild(actions);
    const { research } = researchBox(question, () => truncateAfter(bot));
    bot.appendChild(research);
    bot.appendChild(back);

    // 選んだ話題のチャンク数（重なりは除いて数える）
    function chunkTotal() {
      const ts = [...selected.values()];
      return ts.filter((t) => !ts.some((o) => o !== t && t.path.join(" > ").startsWith(o.path.join(" > ") + " > ")))
        .reduce((a, t) => a + t.chunk_count, 0);
    }
    function update() {
      const n = chunkTotal();
      count.textContent = `${selected.size} 件選択中 / チャンク ${n} 個`;
      warn.textContent = n >= 6 ? "チャンクが6個以上のため、回答に時間がかかります" : "";
      go.disabled = selected.size === 0;
    }
    go.addEventListener("click", () => {
      const many = chunkTotal() >= 6;
      truncateAfter(bot);
      askAnswer(question, [...selected.values()], many);
    });
    scrollBottom();
  }

  // ③ 選んだ話題 → 6個未満は全チャンク、6個以上は上位5チャンク＋JSONの節の本文で回答
  async function askAnswer(question, topics, many) {
    const userMsg = el("div", "msg user", `選んだ話題: ${topics.map((t) => t.title).join("、")}`);
    log.appendChild(userMsg);
    const bot = el("div", "msg bot");
    bot.appendChild(el("div", "role", "回答"));
    if (many) bot.appendChild(el("div", "warn", "チャンクが6個以上のため、回答に時間がかかります。"));
    log.appendChild(bot);
    const data = await withStatus(bot, "回答生成中", () =>
      postJson("/answer", { question, paths: topics.map((t) => t.path) }));
    if (!data) { bot.appendChild(backButton("← 話題を選び直す", userMsg, bot)); return; }
    const how = data.mode === "all"
      ? `チャンク ${data.total_chunks} 個をすべて使用`
      : `チャンク ${data.total_chunks} 個のうち上位 ${data.sources.length} 個 ＋ JSON の節の本文（${data.json_sections.map((j) => `${j.title} ${j.chars}字${j.truncated ? "・上限で途中まで" : ""}`).join("、")}）`;
    bot.appendChild(el("div", "topics-title", how));
    bot.appendChild(el("div", "answer", data.answer));
    bot.appendChild(tokenHint(data, bot.dataset.seconds));
    renderSources(bot, data.sources);
    if (evalState.on && evalState.current) bot.appendChild(evalActions(question, topics, data, bot.dataset.seconds));
    bot.appendChild(backButton("← 話題を選び直す", userMsg, bot));
  }

  // ==========================================
  // 評価モード
  // ==========================================
  const evalState = { on: false, questions: [], recorded: {}, current: null, levelPicks: [] };
  const $id = (id) => document.getElementById(id);
  const RUN_KEY = "rag-eval-run";

  // 記録名: 日時_manual_モデル（例: 20261117_1030_manual_qwen2-5-7b）
  function newRunName() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const model = (evalState.model || "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_manual${model ? "_" + model : ""}`;
  }
  function getRun() { return $id("evalRun").value.trim(); }
  function saveRun() { try { localStorage.setItem(RUN_KEY, getRun()); } catch (e) { /* 保存できなくても続行 */ } }

  async function refreshEval(selectId) {
    const res = await fetch(`/eval/status?run=${encodeURIComponent(getRun())}`);
    evalState.recorded = res.ok ? (await res.json()).recorded : {};
    const sel = $id("evalSelect");
    const keep = selectId || sel.value;
    sel.textContent = "";
    for (const x of evalState.questions) {
      const st = evalState.recorded[x.id];
      const o = el("option", "", `${st === "done" ? "✓" : st === "skipped" ? "－" : "　"} ${x.id} [${x.type}] ${x.question}`);
      o.value = x.id;
      sel.appendChild(o);
    }
    const firstTodo = evalState.questions.find((x) => !evalState.recorded[x.id]);
    sel.value = keep && evalState.questions.some((x) => x.id === keep) ? keep : (firstTodo || evalState.questions[0] || {}).id;
    const done = Object.keys(evalState.recorded).length;
    $id("evalProgress").textContent = `記録 ${done} / ${evalState.questions.length} 問`;
  }

  async function setEval(on) {
    evalState.on = on;
    $id("evalBar").classList.toggle("on", on);
    if (!on) return;
    modeSel.value = "levels";
    if (!evalState.model) {
      // 今つないでいる LLM のモデル名（記録名と表示に使う）
      try { evalState.model = (await (await fetch("/health")).json()).llm_model || ""; } catch (e) { /* 不明でも続行 */ }
      $id("evalProgress").title = `LLM: ${evalState.model}`;
    }
    if (!evalState.questions.length) {
      const res = await fetch("/eval/questions");
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { $id("evalQuestion").textContent = `質問集を読めません: ${data.detail || res.status}`; return; }
      evalState.questions = data.questions;
    }
    if (!getRun()) {
      let saved = null;
      try { saved = localStorage.getItem(RUN_KEY); } catch (e) { /* なし */ }
      // 保存されている記録名が別のモデルのもの（末尾がモデル名でない）なら、上書きしないよう新しい記録にする
      const fresh = newRunName();
      const suffix = fresh.slice(fresh.indexOf("_manual"));
      $id("evalRun").value = saved && saved.endsWith(suffix) ? saved : fresh;
      saveRun();
    }
    await refreshEval();
  }

  // 選んだ質問で①から始める（前のやり取りは消す）
  function startEval() {
    const x = evalState.questions.find((y) => y.id === $id("evalSelect").value);
    if (!x) return;
    evalState.current = x;
    evalState.levelPicks = [];
    $id("evalQuestion").textContent = `${x.id}：${x.question}`;
    log.textContent = "";
    modeSel.value = "levels";
    askLevels(x.question);
  }

  async function record(payload, msgBox) {
    try {
      const r = await postJson("/eval/record", { run: getRun(), ...payload });
      msgBox.textContent = `記録しました（${r.saved}、${r.count} 問）`;
      const idx = evalState.questions.findIndex((y) => y.id === payload.id);
      await refreshEval();
      // 次の未記録の質問を選んでおく
      const next = evalState.questions.slice(idx + 1).find((y) => !evalState.recorded[y.id]);
      if (next) $id("evalSelect").value = next.id;
      return true;
    } catch (err) {
      msgBox.textContent = `記録に失敗: ${err.message}`;
      return false;
    }
  }

  // 回答の下に出す記録ボタン
  function evalActions(question, topics, data, seconds) {
    const x = evalState.current;
    const box = el("div", "eval-actions");
    box.appendChild(el("div", "topics-title", `評価：${x.id} の回答として記録します`));
    const actions = el("div", "actions");
    const save = el("button", "", "この回答を記録して次へ");
    save.type = "button";
    actions.appendChild(save);
    box.appendChild(actions);
    const msg = el("div", "hint", evalState.recorded[x.id] ? "※ この質問は記録済みです。記録すると置き換えます。" : "");
    box.appendChild(msg);
    const base = {
      id: x.id, question,
      level_picks: evalState.levelPicks,
      subtopic_picks: topics.map((t) => ({ title: t.title, path: t.path })),
    };
    save.addEventListener("click", async () => {
      save.disabled = true;
      const ok = await record({
        ...base, answer: data.answer, contexts: data.contexts, mode: data.mode,
        total_chunks: data.total_chunks, prompt_tokens: data.prompt_tokens, seconds: Number(seconds),
      }, msg);
      if (ok) startEval(); else save.disabled = false;
    });
    return box;
  }

  // 回答まで進めない・進めたくない質問は、スキップとして記録する（採点の対象外）
  async function skipEval() {
    const x = evalState.questions.find((y) => y.id === $id("evalSelect").value);
    if (!x) return;
    const ok = await record({ id: x.id, question: x.question, skipped: true }, $id("evalQuestion"));
    if (ok) startEval();
  }

  $id("evalToggle").addEventListener("change", (e) => setEval(e.target.checked));
  $id("evalStart").addEventListener("click", startEval);
  $id("evalSkip").addEventListener("click", skipEval);
  $id("evalRun").addEventListener("change", () => { saveRun(); refreshEval(); });
  $id("evalNewRun").addEventListener("click", () => { $id("evalRun").value = newRunName(); saveRun(); refreshEval(); });
  if (new URLSearchParams(location.search).get("eval") === "1") {
    $id("evalToggle").checked = true;
    setEval(true);
  }

  async function submit() {
    const question = q.value.trim();
    if (!question) return;

    const mode = modeSel.value;
    if (mode === "levels") {
      q.value = "";
      q.style.height = "";
      send.disabled = true;
      try { await askLevels(question); } finally { send.disabled = false; q.focus(); }
      return;
    }
    let topK = parseInt(topkInput.value, 10);
    if (!(topK >= 1 && topK <= 10)) topK = 3;

    document.getElementById("empty")?.remove();
    log.appendChild(el("div", "msg user", question));
    q.value = "";
    q.style.height = "";

    const bot = el("div", "msg bot");
    bot.appendChild(el("div", "role", mode === "ask" ? "回答" : "検索結果"));
    const status = el("div", "loading", mode === "ask" ? "回答生成中… 0秒" : "検索中…");
    bot.appendChild(status);
    log.appendChild(bot);
    scrollBottom();

    send.disabled = true;
    const started = Date.now();
    const timer = setInterval(() => {
      if (mode === "ask") status.textContent = `回答生成中… ${Math.floor((Date.now() - started) / 1000)}秒`;
    }, 1000);

    try {
      const res = await fetch(`/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, top_k: topK }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : `HTTP ${res.status}`);

      status.remove();
      if (mode === "ask") bot.appendChild(el("div", "answer", data.answer));
      renderSources(bot, data.sources);
      if (mode === "ask") {
        bot.appendChild(el("div", "hint", `${((Date.now() - started) / 1000).toFixed(1)}秒`));
      }
    } catch (err) {
      status.remove();
      bot.appendChild(el("div", "error", `エラー: ${err.message}`));
    } finally {
      clearInterval(timer);
      send.disabled = false;
      q.focus();
      scrollBottom();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); if (!send.disabled) submit(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!send.disabled) submit();
    }
  });
  q.addEventListener("input", () => {
    q.style.height = "";
    q.style.height = Math.min(q.scrollHeight, 160) + "px";
  });
</script>
</body>
</html>
