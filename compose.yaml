services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

  # qwen2.5:7b 用（3b の ollama とはモデル保存先も分ける）
  ollama-7b:
    image: ollama/ollama:latest
    container_name: rag-ollama-7b

    ports:
      - "127.0.0.1:11435:11434"

    volumes:
      - ollama_7b_data:/root/.ollama

    restart: unless-stopped

  rag-api:
    build:
      context: ./rag_api
    container_name: rag-api

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: rag_ruri_v3_310m
      EMBEDDING_MODEL: cl-nagoya/ruri-v3-310m
      LLM_MODEL: qwen2.5:3b
      HF_HOME: /models/huggingface
      # 上位の節をたどる文書要素のコレクションと、LLM のコンテキスト長
      DOC_ITEMS_COLLECTION: rag_doc_items
      NUM_CTX: "8192"

    volumes:
      - huggingface_cache:/models/huggingface

    depends_on:
      - qdrant
      - ollama

    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  ollama_7b_data:
  huggingface_cache:
